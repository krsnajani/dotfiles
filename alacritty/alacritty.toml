[general]
live_config_reload = false

[scrolling]
history = 5000

[cursor]
style = "Block"

[env]
TERM = "alacritty"

[font]
size = 18

[font.bold]
family = "SF Mono"
style = "Regular"

[font.italic]
family = "SF Mono"
style = "Regular"

[font.normal]
family = "SF Mono"
style = "Regular"

[window]
decorations = "none"

[window.padding]
x = 15
y = 15

[colors.primary]
background = "#000000"
